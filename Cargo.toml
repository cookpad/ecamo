[package]
name = "ecamo"
version = "0.1.0"
description = "SSL image proxy with JWT authentication"
edition = "2021"
license = "MIT"
repository = "https://github.com/cookpad/ecamo"

[features]
default = ["webapp"]
webapp = [
  "actix-http",
  "actix-web",
  "env_logger",
  "envy",
  "futures",
  "listenfd",
  "reqwest",
  "tokio",
]

[dependencies]
actix-http = { version = "3.21.0", optional = true }
actix-web = { version = "4.19.0", optional = true }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
constant_time_eq = "0.6.1"
env_logger = { version = "0.11.11", optional = true }
envy = { version = "0.4.2", optional = true }
futures = { version = "0.3.34", optional = true }
jwt-simple = { version = "0.15.0", default-features = false, features = ["pure-rust"] }
listenfd = { version = "1.0.2", optional = true }
log = "0.4.35"
rand = "0.10.3"
regex = "1.13.1"
serde = "1.0.229"
serde_json = "1.0.154"
serde_regex = "1.2.0"
sha2 = "0.11.1"
thiserror = "2.0.21"

[dependencies.ecdsa]
features = [
    "signing",
    "verifying",
]
version = "0.16.9"

[dependencies.elliptic-curve]
features = [
    "jwk",
    "serde",
]
version = "0.13.8"

[dependencies.p256]
features = [
    "arithmetic",
    "jwk",
]
version = "0.13.2"

[dependencies.reqwest]
features = [
    "stream",
    "socks",
]
version = "0.13.5"
optional = true

[dependencies.serde_with]
features = ["json"]
version = "3.24.0"

[dependencies.tokio]
features = [
    "rt",
    "rt-multi-thread",
    "io-util",
    "io-std",
    "net",
    "macros",
    "sync",
]
version = "1.54.1"
optional = true

[dependencies.url]
features = ["serde"]
version = "2.5.8"

[dev-dependencies]
actix-rt = "2.15.0"
actix-test = "0.1.6"
bstr = "1.13.1"
httptest = "0.16.4"
lazy_static = "1.5.1"
mockito = "1.7.2"
